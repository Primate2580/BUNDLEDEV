    <h1>Mill Creek walk</h1>
    <img src="images/mill-creek.jpg" alt="Mill Creek running between mossy banks in early morning light" width="800" height="450" fetchpriority="high">
    <p>A gentle two-hour walk beside the creek, with a wooden bridge halfway round.</p>
    <h2>The bridge</h2>
    <figure>
      <img src="images/bridge.jpg" alt="A wooden footbridge with a handrail on both sides, crossing the creek" width="600" height="400">
      <figcaption>The new bridge over Mill Creek, finished in November.</figcaption>
    </figure>
    <img src="images/divider.png" alt="">
    <p>The new bridge was finished in November and has a handrail on both sides.</p>
    <h2>Gallery</h2>
    <img src="images/gallery-1.jpg" alt="The creek in autumn, with red leaves on the water" width="400" height="300" loading="lazy">
    <p>More pictures of the creek through the year.</p>
