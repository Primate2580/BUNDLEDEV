<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walk timetable</title>
  </head>
  <body>
    <h1>Walk timetable</h1>
    <p>This table compares our three walks, so you can pick one for the day.</p>
    <table>
      <thead>
        <tr>
          <th scope="col">Walk</th>
          <th scope="col">Length</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Mill Creek</th>
          <td>5 km</td>
          <td>2 hours</td>
          <td>Easy</td>
        </tr>
        <tr>
          <th scope="row">Ridge Trail</th>
          <td>7 km</td>
          <td>3 hours</td>
          <td>Hard</td>
        </tr>
        <tr>
          <th scope="row">Heron Lake</th>
          <td>4 km</td>
          <td>1.5 hours</td>
          <td>Easy</td>
        </tr>
      </tbody>
    </table>
    Total distance: 16 km
  </body>
</html>
