<section class="panel">
  <h1 class="panel-title">Notification settings</h1>
  <ul class="settings">
    <li class="setting"><input id="s1" type="checkbox" checked /><label for="s1">Email me weekly summaries</label></li>
    <li class="setting"><input id="s2" type="checkbox" /><label for="s2">Text me about trail closures</label></li>
    <li class="setting"><input id="s3" type="checkbox" checked /><label for="s3">Share my routes with friends</label></li>
    <li class="setting"><input id="s4" type="checkbox" disabled /><label for="s4">Beta features (unavailable)</label></li>
  </ul>
  <form class="contact">
    <label for="email">Email address</label>
    <input id="email" class="field" type="email" required placeholder="you@example.com" />
    <button class="save" type="submit" disabled>Save settings</button>
  </form>
  <p class="help">Need help? <a class="help-link" href="#">Contact support</a></p>
</section>
