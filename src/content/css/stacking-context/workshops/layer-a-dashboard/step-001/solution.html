<header class="header">
  <strong class="logo">Trailhead</strong>
  <button class="menu-btn" type="button">Menu</button>
  <ul class="menu">
    <li>Profile</li>
    <li>Settings</li>
  </ul>
</header>

<main class="page">
  <h1 class="title">Pick your trail</h1>
  <section class="cards">
    <article class="card"><h2 class="card-title">Riverside loop</h2><span class="tip">4 km</span></article>
    <article class="card"><h2 class="card-title">Lake path</h2><span class="tip">7 km</span></article>
    <article class="card"><h2 class="card-title">Ridge scramble</h2><span class="tip">9 km</span></article>
  </section>
  <a class="back-top" href="#">Top</a>
</main>

<div class="overlay"></div>
<div class="modal">
  <h2 class="modal-title">Save this route?</h2>
  <button class="close" type="button">Close</button>
</div>
<div class="toast">Route saved</div>
